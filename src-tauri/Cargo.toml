[package]
name = "tabplayer"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[features]
desktop-test = []

[lib]
name = "tabplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
atomic-write-file = "0.3"
fs2 = "=0.4.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "=0.18.2"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
rustysynth = "=1.3.7"
ringbuf = "=0.5.3"
svg2pdf = "=0.13.0"
pdf-writer = "=0.12.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
midly = "=0.5.3"
hound = "=3.5.1"

[patch.crates-io]
usvg = { path = "../vendor/usvg" }
