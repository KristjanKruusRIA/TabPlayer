[package]
name = "tabplayer"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace]
# Members are added by the task that creates them. All of them share this directory's `target` folder and `Cargo.lock`.
members = ["plugin-protocol", "test-plugin", "plugin-host"]

[features]
desktop-test = []

[lib]
name = "tabplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
atomic-write-file = "0.3"
fs2 = "=0.4.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "=0.18.2"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
rustysynth = "=1.3.7"
# Ogg Vorbis export: BSD-3-Clause bindings that build the bundled aoTuV libvorbis and libogg.
vorbis_rs = { version = "=0.5.6", default-features = false }
# MP3 export: LGPL bindings that build the bundled official LAME 3.100 release and link it statically.
mp3lame-sys = { version = "=0.1.11", default-features = false }
ringbuf = "=0.5.3"
# External MIDI output (A26): MIT, thin wrappers over WinMM, CoreMIDI and ALSA.
midir = "=0.11.1"
svg2pdf = "=0.13.0"
resvg = { version = "=0.45.1", default-features = false }
png = "=0.17.16"
pdf-writer = "=0.12.1"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
zeroize = "1.8"
getrandom = "0.3"
subtle = "2.6"
tauri-plugin-single-instance = "=2.5.5"
# The VST3 hosting wire protocol. The app never links plug-in code; it only speaks this protocol to the helper.
tabplayer-plugin-protocol = { path = "plugin-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The plug-in helper client (THE-71): the job object that ends helpers with the app, the shared ring mapping, the wake-up
# events and the handle duplication into a helper. Already in the lockfile through tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
midly = "=0.5.3"
hound = "=3.5.1"
nam-rs = "=0.4.0"
# Only for `TEST_CLASS_ID` and `encode_test_state` in the helper client's tests: the app never links plug-in code (preflight ruling P25).
tabplayer-test-plugin = { path = "test-plugin" }

[patch.crates-io]
usvg = { path = "../vendor/usvg" }

# Password hashing is memory-hard, so an unoptimized build would take many seconds per attempt.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Every file in tests/ links the whole app into its own binary. Keeping line tables for backtraces and no debug info for dependencies stops those links exhausting memory.
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
