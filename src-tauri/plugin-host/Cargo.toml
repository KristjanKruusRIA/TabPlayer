[package]
name = "tabplayer-plugin-host"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The VST3 plug-in host helper: one plug-in per process, run out of process for TabPlayer (THE-71)."

[[bin]]
name = "tabplayer-plugin-host"
path = "src/main.rs"

[dependencies]
tabplayer-plugin-protocol = { path = "../plugin-protocol" }

# The hosting core is Rust (Spike 1). The vendored SoundCraft FFI needs `vst3`, `libloading` and `log`; the Win32 calls
# (the message loop, the editor window, the shared mapping, the events, the job of the stdio handles) need `windows-sys`.
# Other platforms build only the stub that answers every request with `UnsupportedPlatform`.
[target.'cfg(windows)'.dependencies]
vst3 = "=0.3.0"
libloading = "=0.9.0"
log = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only for `TEST_CLASS_ID` and `encode_test_state`: the helper never links plug-in code (preflight ruling P25).
tabplayer-test-plugin = { path = "../test-plugin" }
tempfile = "3"
