[package]
name = "tabplayer-plugin-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The wire protocol between TabPlayer and its VST3 helper process: a shared-memory audio ring, bounded control frames and the plug-in state container."

# Exact pins at the versions the workspace lockfile already holds, so this crate adds no new third-party code.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
